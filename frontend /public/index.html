<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Zerops Uptime Monitor</title>
        <script src="https://cdn.tailwindcss.com"></script>
        </head>
        <body class="bg-gray-900 text-white p-6 font-sans">
          <div class="max-w-2xl mx-auto">
              <h1 class="text-3xl font-bold mb-2 text-green-400">Zerops Uptime Monitor</h1>
                  <p class="text-gray-400 mb-6">Real-time status monitor running on 3 Zerops Services.</p>

                      <div class="bg-gray-800 p-4 rounded-lg mb-6 shadow">
                            <h2 class="text-xl font-semibold mb-3">Add Endpoint</h2>
                                  <div class="flex gap-2">
                                          <input id="urlInput" type="text" placeholder="https://example.com" class="flex-1 bg-gray-700 p-2 rounded border border-gray-600 text-white focus:outline-none">
                                                  <button onclick="addMonitor()" class="bg-green-500 hover:bg-green-600 text-black font-bold px-4 py-2 rounded">Add</button>
                                                        </div>
                                                            </div>

                                                                <div id="monitorsList" class="space-y-3"></div>
                                                                  </div>

                                                                    <script>
                                                                        async function fetchMonitors() {
                                                                              try {
                                                                                      const res = await fetch('/api/monitors');
                                                                                              const data = await res.json();
                                                                                                   const container = document.getElementById('monitorsList');
                                                                                                              container.innerHTML = data.map(m => `
                                                                                                                        <div class="bg-gray-800 p-4 rounded flex justify-between items-center border-l-4 ${m.status === 'UP' ? 'border-green-500' : 'border-red-500'}">
                                                                                                                                    <div>
                                                                                                                                                  <div class="font-bold">${m.url}</div>
                                                                                                                                                                <div class="text-xs text-gray-400">Latency: ${m.latency}ms</div>
                                                                                                                                                                            </div>
                                                                                                                                                                                        <span class="px-3 py-1 rounded text-xs font-bold ${m.status === 'UP' ? 'bg-green-900 text-green-300' : 'bg-red-900 text-red-300'}">${m.status}</span>
                                                                                                                                                                                                  </div>
                                                                                                                                                                                                          `).join('');
                                                                                                                                                                                                                } catch (e) {
                                                                                                                                                                                                                       console.error(e);
                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                      async function addMonitor() {
                                                                                                                                                                                                                                            const url = document.getElementById('urlInput').value;
                                                                                                                                                                                                                                                  if (!url) return;
                                                                                                                                                                                                                                                        await fetch('/api/monitors', {
                                                                                                                                                                                                                                                                method: 'POST',
                                                                                                                                                                                                                                                                        headers: { 'Content-Type': 'application/json' },
                                                                                                                                                                                                                                                                                body: JSON.stringify({ url })
                                                                                                                                                                                                                                                                                      });
                                                                                                                                                                                                                                                                                            document.getElementById('urlInput').value = '';
                                                                                                                                                                                                                                                                                                  fetchMonitors();
                                                                                                                                                                                                                                                                                                   }

                                                                                                                                                                                                                                                                                                          fetchMonitors();
                                                                                                                                                                                                                                                                                                              setInterval(fetchMonitors, 5000);
                                                                                                                                                                                                                                                                                                                </script>
                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                </html>
